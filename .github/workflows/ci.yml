name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: make install
        run: make install
      - name: make lint
        run: make lint
      - name: check uv.lock is current
        run: git add --all && git diff --cached --exit-code

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: make install
        run: make install
      - name: make test
        run: make test

  data:
    name: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: make install
        run: make install
      - name: make data
        run: make data
      - name: check data/sample.csv is current
        run: git add --all && git diff --cached --exit-code

  reference:
    name: reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: make reference
        run: make reference
      - name: check tests/golden/ is current
        run: git add --all && git diff --cached --exit-code

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: make docker-build
        run: make docker-build
